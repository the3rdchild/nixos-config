<!-- Tab icon: a fan, in red.

     Not the FanRotor blade from the panel. That rotor has seven thin
     outlined petals around a dark hub, and shrunk to 16px it stops being a
     fan — five or seven fat petals with a hole in the middle read as a
     flower, which is what the first attempt at this file turned out to be.

     What survives at tab size is the impeller cue: four swept blades with
     clear gaps, drawn as round-capped strokes so each one keeps a leading
     edge and a curl, inside a ring that stands in for the fan guard. The
     ring is doing most of the work — it is what says "fan" before any
     detail is resolvable.

     Red rather than the keyboard accent on purpose: the accent follows the
     backlight and changes minute to minute, and a tab icon that changes
     colour is a tab you stop recognising. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#ff2b1a" stroke-linecap="round">
    <!-- Guard. -->
    <circle cx="50" cy="50" r="45" stroke-width="7"/>
    <!-- Blades. One sickle, four times. -->
    <g stroke-width="12">
      <path d="M50 42 C 50 28 54 21 62 19"/>
      <path d="M50 42 C 50 28 54 21 62 19" transform="rotate(90 50 50)"/>
      <path d="M50 42 C 50 28 54 21 62 19" transform="rotate(180 50 50)"/>
      <path d="M50 42 C 50 28 54 21 62 19" transform="rotate(270 50 50)"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="11" fill="#ff2b1a"/>
</svg>
